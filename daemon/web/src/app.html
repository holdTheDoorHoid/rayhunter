<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script>
            // Runs before first paint so the page never flashes the wrong
            // appearance. Mirrors resolve_theme() in lib/theme.svelte.ts.
            try {
                var p = localStorage.getItem('rayhunter-theme') || 'system';
                var dark =
                    p === 'dark' ||
                    (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            } catch (e) {}
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover" style="width: 100%">
        <div style="display: contents" class="m-4 xl:m-8">%sveltekit.body%</div>
    </body>
</html>
