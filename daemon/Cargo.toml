[package]
name = "rayhunter-daemon"
version = "0.12.3"
edition = "2024"
rust-version = "1.98.0"

[lib]
name = "rayhunter_daemon"
path = "src/lib.rs"

[[bin]]
name = "gen_api"
path = "src/bin/gen_api.rs"
required-features = ["apidocs"]

[features]
default = ["rustcrypto-tls"]
rustcrypto-tls = ["reqwest/rustls-tls-webpki-roots-no-provider", "dep:rustls-rustcrypto"]
pq-tls = ["reqwest/rustls-tls-webpki-roots-no-provider", "dep:rustls-post-quantum"]
apidocs = ["dep:utoipa", "wifi-station/utoipa", "rayhunter-radio/apidocs"]

[dependencies]
sha2 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
fastrand = "2"
base64 = "0.22"
rayhunter = { path = "../lib" }
rayhunter-radio = { path = "../radio" }
wifi-station = "0.10.1"
toml = "0.8.8"
serde = { version = "1.0.193", features = ["derive"] }
serde_repr = "0.1"
tokio = { version = "1.44.2", default-features = false, features = ["fs", "net", "signal", "process", "rt", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
thiserror = "1.0.52"
libc = "0.2.150"
if-addrs = "0.13"
log = "0.4.20"
tokio-util = { version = "0.7.10", features = ["rt", "io", "compat"] }
futures-macro = "0.3.30"
include_dir = "0.7.3"
chrono = { version = "0.4.31", features = ["serde"] }
tokio-stream = { version = "0.1.14", default-features = false, features = ["io-util"] }
futures = { version = "0.3.32", default-features = false, features = ["std"] }
serde_json = "1.0.114"
deku = "0.20.0"
pycrate-rs = { git = "https://github.com/EFForg/pycrate-rs" }
image = { version =  "0.25.1", default-features = false, features = ["png", "gif"] }
tempfile = "3.10.2"
async_zip = { version = "0.0.17", features = ["tokio"] }
anyhow = "1.0.98"
reqwest = { version = "0.12.20", default-features = false, features = ["stream"] }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true }
rustls-post-quantum = { version = "0.2.4", optional = true }
async-trait = "0.1.88"
# The "repr" feature makes ToSchema honor #[repr(uN)] on serde_repr enums.
#
# Using a feature is a pretty huge footgun, since feature unification can
# silently change behavior across crates. We should switch to
# https://github.com/juhaku/utoipa/pull/1539 as soon as it lands.
utoipa = { version = "5.4.0", features = ["repr"], optional = true }
url = "2.5.4"
qrcodegen = "1.8"
x509-cert = { version = "0.2.5", features = ["builder", "hazmat"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
# `pkcs8`/`pem` and sha2's `oid` are what the certificate builder needs to
# name the signature algorithm and encode the public key; the RustCrypto TLS provider happened to enable
# them, the post-quantum firmware build does not, so they are named here.
ecdsa = { version = "0.16", default-features = false, features = ["der", "signing", "verifying", "pkcs8", "pem"] }
der = { version = "0.7", features = ["std"] }
const-oid = { version = "0.9", features = ["db"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
getrandom = "0.2"
socket2 = "0.5"

[dev-dependencies]
reqwest = { version = "0.12.20", default-features = false, features = ["gzip"] }
tempfile = "3.10.2"
