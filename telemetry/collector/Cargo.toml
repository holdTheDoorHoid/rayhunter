[package]
name = "rayhunter-collector"
version = "0.12.3"
edition = "2024"
rust-version = "1.88.0"
description = "Receives, reviews and publishes recordings contributed by Rayhunter units"
license = "GPL-3.0"

[[bin]]
name = "rayhunter-collector"
path = "src/main.rs"

[dependencies]
telemetry-format = { package = "rayhunter-telemetry-format", path = "../format" }
anyhow = "1.0"
async_zip = { version = "0.0.17", features = ["tokio"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# When this crate is built alongside the daemon, feature unification gives
# reqwest a rustls backend, and rustls then needs a crypto provider installed
# before a client can be made. The daemon uses this one; the tests install it
# too so they pass in both a lone and a workspace build.
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-rustcrypto = "0.0.2-alpha"
tempfile = "3"
