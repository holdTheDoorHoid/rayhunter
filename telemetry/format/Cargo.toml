[package]
name = "rayhunter-telemetry-format"
version = "0.12.3"
edition = "2024"
rust-version = "1.88.0"
description = "The envelope a Rayhunter unit puts around a recording it contributes: keys, streamed encryption, and signed manifests"
license = "GPL-3.0"

[lib]
name = "telemetry_format"
path = "src/lib.rs"

[features]
apidocs = ["dep:utoipa"]

[dependencies]
utoipa = { version = "5.4.0", optional = true }
# HPKE (RFC 9180) on the same RustCrypto line the daemon already builds:
# p256 0.13, chacha20poly1305 0.10, hkdf 0.12. Nothing here is a new
# elliptic-curve stack.
hpke = { version = "0.12", default-features = false, features = ["p256", "alloc"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"] }
ecdsa = { version = "0.16", default-features = false, features = ["der", "signing", "verifying", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
