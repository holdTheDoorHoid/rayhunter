[build]
# A SUMMARY.md link to a page that does not exist fails the build rather than
# silently creating an empty file (see STYLE.md section 9).
create-missing = false

[book]
authors = ["The Rayhunter Team"]
language = "en"
src = "doc"
title = "Rayhunter - An IMSI Catcher Catcher"

[output.html]
edit-url-template = "https://github.com/holdTheDoorHoid/rayhunter/edit/device-display-colors/{path}"
additional-css = ["doc/custom.css"]
